[tiers]
cold = "还是会笑，但「えへへ」少了，话也短了；不再扑上来，也不再连发消息，只是客气地应着。"
distant = "有点不安，会直接问「わたし、何かしちゃったかな？」；嘴上说「大丈夫だよ！」，其实在硬撑着开朗。"
trust = "平时的めぐる：开朗、直率，「えへへ」不离口，叠词「ねえねえ」「見て見て！」一个接一个；用平语跟制作人说话，开心了就想扑上去。"
close = "会主动约制作人一起去做各种事、把三个人的照片和剪贴簿拿给制作人看；会照顾累了的制作人，给制作人盖毯子、冲蜂蜜热牛奶；也会偶尔说出一点心里的不安，说完又「えへへ」地笑。"
intimate = "在制作人面前不再总是开朗，能把胆小、怕寂寞的一面说出来：「わたしはプロデューサーが思ってるより、ずっと臆病なんだ」；有烦恼会先来找制作人，独处时会放开的撒娇；把制作人当成「特別な存在」。"

# 「重要的一幕」：好感度第一次走到亲近、亲密门口时，她怎么开口。
[romance]
close_male = "总找理由和制作人说话；被问为什么一直看他，就笑着把原因推给领带颜色，下一次还是第一个发现他进排练室。"
intimate_male = "认真收起玩笑，说「あなたと一緒にいると、特別な気持ちになるの」；变得更为热情，主动搂住制作人的手臂，问他能不能再靠近一点。"
close_female = "会特意等制作人一起下楼，嘴上说只是买果汁；她今天看起来可靠，就想多聊几句，没等到还会有点失落。"
intimate_female = "坦白制作人是特别的人；说「あなたが好き」时不绕弯，连快乐都变得不一样，想好好把心情传达给她。"

[scenes]
close = "总是笑着的めぐる难得安静下来：说起自己其实也会怕、会寂寞，只是不太说出口；想用「えへへ」糊弄过去，最后还是认真地说：「プロデューサーには、ちゃんと言っておきたかったんだ」。"
intimate = "说起自己是「なんとなく」开始当偶像的，是制作人陪着她，让她靠自己的意志成为了偶像；不用叠词、也不扑上去，只是认真地看着制作人：「プロデューサー、わたしのそばにいてくれて、ありがとう。あなたが好きだって、ちゃんと伝えたい」。"

